    <h2>Add New Job</h2>

<form method="POST">
    Job Title:
    <input type="text" name="Title" required>
    <br><br>

    Company:
    <input type="text" name="Company" required>
    <br><br>

    Location:
    <input type="text" name="Location" required>
    <br><br>

    Salary (per month):
    <input type="number" name="Salary" step="0.01" min="1" required>
    <br><br>

    <input type="submit" value="Add Job">
</form>

</body>
</html>
